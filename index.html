<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot & Flamingo Multiplayer</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background-color: #1a1a1a; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }

        #ui-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.8); padding: 15px;
            border-radius: 12px; color: white; width: 180px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #444; z-index: 100;
        }
        #ui-panel h3 { margin: 0 0 10px; font-size: 14px; color: #00d4ff; }

        #room-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.97); padding: 40px 35px;
            border-radius: 18px; text-align: center; color: white;
            z-index: 2000; border: 2px solid #00d4ff;
            box-shadow: 0 0 40px rgba(0,212,255,0.3);
            min-width: 300px;
        }
        #room-panel h2 { margin: 0 0 8px; font-size: 22px; color: #00d4ff; letter-spacing: 2px; }
        #room-panel p { margin: 0 0 20px; color: #aaa; font-size: 13px; }

        #controls-wrapper {
            position: absolute; bottom: 30px; left: 30px;
            width: 160px; height: 160px; z-index: 100;
        }
        #joystick-zone {
            width: 160px; height: 160px; border-radius: 50%;
            background: rgba(0,212,255,0.06);
            border: 2px solid rgba(0,212,255,0.35);
            box-shadow: 0 0 18px rgba(0,212,255,0.15);
            position: relative; touch-action: none; user-select: none;
            display: flex; align-items: center; justify-content: center;
        }
        /* vạch chữ thập mờ */
        #joystick-zone::before, #joystick-zone::after {
            content: ''; position: absolute; background: rgba(0,212,255,0.18);
            border-radius: 2px;
        }
        #joystick-zone::before { width: 2px; height: 120px; }
        #joystick-zone::after  { width: 120px; height: 2px; }
        /* mũi tên gợi ý */
        .joy-arrow {
            position: absolute; color: rgba(0,212,255,0.35);
            font-size: 18px; pointer-events: none; line-height: 1;
        }
        .joy-arrow.top    { top: 10px;  left: 50%; transform: translateX(-50%); }
        .joy-arrow.bottom { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .joy-arrow.left   { left: 10px; top: 50%; transform: translateY(-50%); }
        .joy-arrow.right  { right: 10px; top: 50%; transform: translateY(-50%); }
        #joystick-thumb {
            width: 56px; height: 56px; border-radius: 50%;
            background: radial-gradient(circle at 38% 38%, rgba(0,212,255,0.55), rgba(0,80,120,0.7));
            border: 2px solid #00d4ff;
            box-shadow: 0 0 14px rgba(0,212,255,0.5);
            position: absolute; transform: translate(-50%,-50%);
            left: 50%; top: 50%;
            transition: box-shadow 0.1s;
            pointer-events: none;
        }
        #joystick-thumb.active {
            box-shadow: 0 0 28px rgba(0,212,255,0.85);
        }

        #room-input {
            padding: 12px 15px; border-radius: 8px;
            border: 2px solid #00d4ff; background: #111;
            color: white; margin-bottom: 15px;
            width: 100%; font-size: 16px; letter-spacing: 2px;
            text-align: center; outline: none;
        }
        #room-input::placeholder { color: #555; letter-spacing: 1px; font-size: 13px; }
        #join-btn {
            background: #00d4ff; color: #000;
            border: none; padding: 13px 0; border-radius: 8px;
            cursor: pointer; width: 100%; font-size: 15px;
            font-weight: bold; letter-spacing: 2px;
            transition: background 0.2s, transform 0.1s;
        }
        #join-btn:hover { background: #33ddff; }
        #join-btn:active { transform: scale(0.97); }

        #buttons {
            display: flex; flex-direction: column; gap: 5px;
            max-height: 45vh; overflow-y: auto;
        }
        #buttons button {
            background: rgba(255,255,255,0.08); color: #eee;
            border: 1px solid #444; padding: 8px 10px;
            border-radius: 6px; cursor: pointer; font-size: 12px;
            transition: background 0.15s; text-align: left;
        }
        #buttons button:hover { background: rgba(0,212,255,0.2); border-color: #00d4ff; }
        #buttons button.active-anim { background: rgba(0,212,255,0.25); border-color: #00d4ff; color: #00d4ff; }

        .controls-hint {
            position: absolute; bottom: 22px; right: 22px;
            color: rgba(0,212,255,0.6); font-size: 12px;
            background: rgba(0,0,0,0.5); padding: 6px 12px;
            border-radius: 8px; border: 1px solid rgba(0,212,255,0.2);
        }
        #toggle-ui-btn {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); border: 1px solid #00d4ff;
            color: #00d4ff; padding: 6px 14px; border-radius: 20px;
            cursor: pointer; font-size: 11px; letter-spacing: 1px;
            z-index: 200; transition: opacity 0.3s, background 0.2s; user-select: none;
            opacity: 0.15;
        }
        #toggle-ui-btn:hover { background: rgba(0,212,255,0.2); opacity: 1; }
        .ui-hidden #ui-panel,
        .ui-hidden #status-bar,
        .ui-hidden .controls-hint,
        .ui-hidden #chat-panel { opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        #ui-panel, #status-bar, .controls-hint, #chat-panel { transition: opacity 0.3s; }

        #status-bar {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.7); color: #00d4ff;
            padding: 8px 14px; border-radius: 8px;
            font-size: 12px; border: 1px solid #333; z-index: 100;
        }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1500;
            display: flex; align-items: center; justify-content: center;
            color: #00d4ff; font-size: 16px; letter-spacing: 2px;
        }
        #name-input {
            padding: 12px 15px; border-radius: 8px;
            border: 2px solid #555; background: #111;
            color: white; margin-bottom: 12px;
            width: 100%; font-size: 15px;
            text-align: center; outline: none;
            transition: border-color 0.2s;
        }
        #name-input:focus { border-color: #00d4ff; }
        #name-input::placeholder { color: #555; font-size: 13px; }
        #nametag-canvas {
            position: absolute; top: 0; left: 0;
            pointer-events: none; z-index: 50;
        }
        #chat-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 420px; z-index: 100;
            display: none; flex-direction: column; gap: 6px;
        }
        #chat-log {
            background: rgba(0,0,0,0.75);
            border: 1px solid #333; border-radius: 10px;
            padding: 10px; max-height: 200px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 4px;
        }
        #chat-log::-webkit-scrollbar { width: 4px; }
        #chat-log::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        .chat-msg { font-size: 12px; color: #eee; line-height: 1.4; animation: fadeInMsg 0.2s ease; }
        .chat-msg .chat-name { color: #00d4ff; font-weight: bold; margin-right: 4px; }
        .chat-msg.mine .chat-name { color: #ffcc00; }
        @keyframes fadeInMsg { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
        #chat-input-row { display: flex; gap: 6px; }
        #chat-input {
            flex: 1; padding: 10px 12px; border-radius: 8px;
            border: 2px solid #333; background: rgba(0,0,0,0.85);
            color: white; font-size: 13px; outline: none; transition: border-color 0.2s;
        }
        #chat-input:focus { border-color: #00d4ff; }
        #chat-input::placeholder { color: #555; }
        #chat-send {
            background: #00d4ff; color: #000; border: none;
            padding: 10px 14px; border-radius: 8px; cursor: pointer;
            font-weight: bold; font-size: 13px; transition: background 0.15s;
        }
        #chat-send:hover { background: #33ddff; }
    </style>
</head>
<body>

    <div id="room-panel">
        <h2>⚡ ROBOT ARENA</h2>
        <p>Đặt tên và nhập mã phòng</p>
        <input type="text" id="name-input" placeholder="Tên nhân vật (vd: CaoThủ99)" maxlength="16">
        <input type="text" id="room-input" placeholder="Mã phòng (vd: PHONG789)" maxlength="12">
        <button id="join-btn">VÀO PHÒNG</button>
    </div>

    <div id="loading-overlay" style="display:none;">
        <span id="loading-text">⏳ Đang tải mô hình...</span>
    </div>

    <div id="ui-panel" style="display: none;">
        <h3 id="room-display">PHÒNG: --</h3>
        <div id="buttons"></div>
    </div>

    <div id="status-bar" style="display:none;">
        👾 <span id="player-count">1</span> người chơi
    </div>

    <canvas id="nametag-canvas"></canvas>

    <div id="chat-panel">
        <div id="chat-log"></div>
        <div id="chat-input-row">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." maxlength="80" autocomplete="off">
            <button id="chat-send">Gửi</button>
        </div>
    </div>

    <div id="controls-wrapper">
        <div id="joystick-zone">
            <span class="joy-arrow top">▲</span>
            <span class="joy-arrow bottom">▼</span>
            <span class="joy-arrow left">◀</span>
            <span class="joy-arrow right">▶</span>
            <div id="joystick-thumb"></div>
        </div>
    </div>

    <div class="controls-hint">W A S D hoặc nút bấm để di chuyển</div>
    <button id="toggle-ui-btn">👁 ẨN UI</button>

        let scene, camera, renderer, clock, orbitControls;

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d0d14);
            clock = new THREE.Clock();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 12, 28);

            scene.add(new THREE.HemisphereLight(0x88ccff, 0x224466, 2.5));

            sun.position.set(8, 15, 10); sun.castShadow = true; scene.add(sun);

            fill.position.set(-10, 5, -10); scene.add(fill);

            createGoals();

            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);

        function createSoccerBall() {
            // Quả bóng đá được dựng bằng geometry + texture canvas
            const geo = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);

            // Vẽ texture bóng đá bằng canvas
            const size = 512;
            const tc = document.createElement('canvas');
            tc.width = tc.height = size;
            const cx = tc.getContext('2d');

            // Nền trắng
            cx.fillStyle = '#ffffff';
            cx.fillRect(0, 0, size, size);

            // Vẽ các mảnh ngũ giác đen theo mẫu bóng đá cổ điển
            const hexagons = [
                [256,256],[256,90],[420,170],[420,342],[256,422],[92,342],[92,170],
                [140,60],[372,60],[480,230],[480,370],[140,460],[372,460],[50,300],[50,200]
            ];
            cx.fillStyle = '#111111';
            hexagons.forEach(([hx, hy]) => {
                cx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const ang = (i * Math.PI / 3) - Math.PI / 6;
                    const r = 46;
                    const px = hx + r * Math.cos(ang);
                    const py = hy + r * Math.sin(ang);
                    i === 0 ? cx.moveTo(px, py) : cx.lineTo(px, py);
                }
                cx.closePath();
                cx.fill();
            });
            // Viền bóng
            cx.strokeStyle = '#222';
            cx.lineWidth = 3;
            cx.beginPath(); cx.arc(size/2, size/2, size/2-2, 0, Math.PI*2); cx.stroke();

            const tex = new THREE.CanvasTexture(tc);
            const mat = new THREE.MeshStandardMaterial({
                map: tex,
                roughness: 0.6,
                metalness: 0.05,
            });

            soccerBall = new THREE.Mesh(geo, mat);
            soccerBall.castShadow = true;
            soccerBall.receiveShadow = true;
            soccerBall.position.set(0, BALL_RADIUS, 5);
            scene.add(soccerBall);
        }

        function updateSoccerBall(dt) {
            if (!soccerBall) return;

            // Ma sát
            ballVel.x *= Math.pow(BALL_FRICTION, dt * 60);
            ballVel.z *= Math.pow(BALL_FRICTION, dt * 60);

            // Di chuyển
            soccerBall.position.x += ballVel.x * dt;
            soccerBall.position.z += ballVel.z * dt;
            soccerBall.position.y  = BALL_RADIUS; // giữ trên mặt đất

            // Giới hạn trong arena
            const BOUND = 28;
            if (Math.abs(soccerBall.position.x) > BOUND) { ballVel.x *= -BALL_BOUNCE; soccerBall.position.x = Math.sign(soccerBall.position.x)*BOUND; }
            if (Math.abs(soccerBall.position.z) > BOUND) { ballVel.z *= -BALL_BOUNCE; soccerBall.position.z = Math.sign(soccerBall.position.z)*BOUND; }

            // Lăn (quay theo hướng di chuyển)
            const speed = Math.sqrt(ballVel.x*ballVel.x + ballVel.z*ballVel.z);
            if (speed > 0.01) {
                const rollAxis = new THREE.Vector3(ballVel.z, 0, -ballVel.x).normalize();
                const rollAngle = (speed * dt) / BALL_RADIUS;
                soccerBall.rotateOnWorldAxis(rollAxis, rollAngle);
            }

            // --- Va chạm với myRobot ---
            if (jumpCooldown > 0) jumpCooldown -= dt;
            if (myRobot) {
                const dx = soccerBall.position.x - myRobot.position.x;
                const dz = soccerBall.position.z - myRobot.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                const minDist = BALL_RADIUS + ROBOT_RADIUS;
                if (dist < minDist && dist > 0.001) {
                    const nx = dx/dist, nz = dz/dist;
                    // Đẩy bóng ra ngoài vùng overlap
                    soccerBall.position.x = myRobot.position.x + nx * minDist;
                    soccerBall.position.z = myRobot.position.z + nz * minDist;
                    // Tính lực đá từ vận tốc robot
                    const robotSpeed = Math.sqrt(velocity.x*velocity.x + velocity.y*velocity.y);
                    const impulse = 3 + robotSpeed * 2.2;
                    // Chỉ đẩy nếu bóng chưa bay ra xa
                    const dot = ballVel.x*nx + ballVel.z*nz;
                    if (dot < impulse) {
                        ballVel.x += nx * (impulse - dot);
                        ballVel.z += nz * (impulse - dot);
                    }
                }
            }

            // --- Va chạm với otherRobots ---
            for (const id in otherRobots) {
                const rb = otherRobots[id].mesh;
                const dx = soccerBall.position.x - rb.position.x;
                const dz = soccerBall.position.z - rb.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                const minDist = BALL_RADIUS + ROBOT_RADIUS;
                if (dist < minDist && dist > 0.001) {
                    const nx = dx/dist, nz = dz/dist;
                    soccerBall.position.x = rb.position.x + nx * minDist;
                    soccerBall.position.z = rb.position.z + nz * minDist;
                    const dot = ballVel.x*nx + ballVel.z*nz;
                    if (dot < 5) { ballVel.x += nx*(5-dot); ballVel.z += nz*(5-dot); }
                }
            }
        }

        function createPitch() {
            // --- Nền cỏ sọc ---
            const W = 60, H = 60;
            const tc = document.createElement('canvas');
            tc.width = 1024; tc.height = 1024;
            const cx = tc.getContext('2d');

            // Sọc cỏ xen kẽ
            const stripes = 10;
            const sw = tc.width / stripes;
            for (let i = 0; i < stripes; i++) {
                cx.fillStyle = i % 2 === 0 ? '#0e3d18' : '#114a1e';
                cx.fillRect(i * sw, 0, sw, tc.height);
            }
            const grassTex = new THREE.CanvasTexture(tc);
            grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
            grassTex.repeat.set(1, 1);

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(W, H),
                new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.9, metalness: 0 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.01;
            ground.receiveShadow = true;
            scene.add(ground);

            // --- Vạch kẻ sân ---
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xccddcc, depthWrite: false });
            function addLine(x1,z1,x2,z2, thick=0.18) {
                const dx = x2-x1, dz = z2-z1;
                const len = Math.sqrt(dx*dx+dz*dz);
                const angle = Math.atan2(dx, dz);
                const mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(thick, len),
                    lineMat
                );
                mesh.rotation.x = -Math.PI/2;
                mesh.rotation.z = -angle;
                mesh.position.set((x1+x2)/2, 0.01, (z1+z2)/2);
                scene.add(mesh);
            }
            function addCircle(cx, cz, r, segs=64, thick=0.18) {
                for (let i=0; i<segs; i++) {
                    const a1 = (i/segs)*Math.PI*2, a2 = ((i+1)/segs)*Math.PI*2;
                    addLine(cx+Math.sin(a1)*r, cz+Math.cos(a1)*r, cx+Math.sin(a2)*r, cz+Math.cos(a2)*r, thick);
                }
            }
            function addArc(cx, cz, r, startA, endA, segs=32, thick=0.18) {
                for (let i=0; i<segs; i++) {
                    const a1 = startA+(i/segs)*(endA-startA);
                    const a2 = startA+((i+1)/segs)*(endA-startA);
                    addLine(cx+Math.sin(a1)*r, cz+Math.cos(a1)*r, cx+Math.sin(a2)*r, cz+Math.cos(a2)*r, thick);
                }
            }

            // Đường biên ngoài
            addLine(-28,-28, 28,-28);
            addLine( 28,-28, 28, 28);
            addLine( 28, 28,-28, 28);
            addLine(-28, 28,-28,-28);

            // Đường giữa sân (ngang)
            addLine(-28, 0, 28, 0);

            // Vòng tròn giữa sân
            addCircle(0, 0, 6);
            // Chấm giữa
            const dotGeo = new THREE.CircleGeometry(0.22, 16);
            const dot = new THREE.Mesh(dotGeo, lineMat);
            dot.rotation.x = -Math.PI/2; dot.position.y = 0.01;
            scene.add(dot);

            // Khung cấm địa lớn (penalty area) – 2 đầu
            const PAW = 22, PAD = 10;
            // Đầu +Z
            addLine(-PAW/2, 28, -PAW/2, 28-PAD);
            addLine( PAW/2, 28,  PAW/2, 28-PAD);
            addLine(-PAW/2, 28-PAD, PAW/2, 28-PAD);
            // Đầu -Z
            addLine(-PAW/2,-28, -PAW/2,-(28-PAD));
            addLine( PAW/2,-28,  PAW/2,-(28-PAD));
            addLine(-PAW/2,-(28-PAD), PAW/2,-(28-PAD));

            // Khung cấm địa nhỏ (goal area)
            const GAW = 10, GAD = 4;
            addLine(-GAW/2, 28, -GAW/2, 28-GAD);
            addLine( GAW/2, 28,  GAW/2, 28-GAD);
            addLine(-GAW/2, 28-GAD, GAW/2, 28-GAD);

            addLine(-GAW/2,-28, -GAW/2,-(28-GAD));
            addLine( GAW/2,-28,  GAW/2,-(28-GAD));
            addLine(-GAW/2,-(28-GAD), GAW/2,-(28-GAD));

            // Chấm phạt đền
            [-28+11, 28-11].forEach(pz => {
                const pd = new THREE.Mesh(new THREE.CircleGeometry(0.22, 16), lineMat);
                pd.rotation.x = -Math.PI/2; pd.position.set(0, 0.01, pz); scene.add(pd);
            });

            // Cung phạt đền (D-arc)
            addArc(0,  28-11, 7.3,  Math.PI*0.82, Math.PI*1.18, 24);
            addArc(0,-(28-11),7.3, -Math.PI*0.18, Math.PI*0.18, 24);

            // 4 góc sân (cung góc)
            const CR = 1.2;
            addArc(-28,-28, CR, 0,        Math.PI/2, 10);
            addArc( 28,-28, CR, Math.PI/2, Math.PI,  10);
            addArc( 28, 28, CR, Math.PI,  Math.PI*1.5,10);
            addArc(-28, 28, CR, Math.PI*1.5, Math.PI*2,10);
        }

        function createGoals() {
            const postMat  = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.6, roughness: 0.3, emissive: 0x334455 });
            const netMat   = new THREE.MeshBasicMaterial({ color: 0xaaddff, wireframe: true, transparent: true, opacity: 0.35 });

            const GW = 10, GH = 4, GD = 2; // width, height, depth khung thành

            function buildGoal(zSign) {
                const group = new THREE.Group();

                // Cột trái, cột phải, xà ngang
                const postGeo = new THREE.CylinderGeometry(0.18, 0.18, GH, 12);
                const crossGeo= new THREE.CylinderGeometry(0.18, 0.18, GW + 0.36, 12);
                // Cọc sau (depth) trái + phải
                const depthGeo= new THREE.CylinderGeometry(0.12, 0.12, GD, 8);

                const leftPost  = new THREE.Mesh(postGeo,  postMat); leftPost.position.set(-GW/2, GH/2, 0); group.add(leftPost);
                const rightPost = new THREE.Mesh(postGeo,  postMat); rightPost.position.set( GW/2, GH/2, 0); group.add(rightPost);
                const crossbar  = new THREE.Mesh(crossGeo, postMat);
                crossbar.rotation.z = Math.PI/2; crossbar.position.set(0, GH, 0); group.add(crossbar);

                // Cọc sau (nối về phía sau khung)
                const backDepthL = new THREE.Mesh(depthGeo, postMat);
                backDepthL.rotation.x = Math.PI/2; backDepthL.position.set(-GW/2, GH/2, -zSign*GD/2); group.add(backDepthL);
                const backDepthR = new THREE.Mesh(depthGeo, postMat);
                backDepthR.rotation.x = Math.PI/2; backDepthR.position.set( GW/2, GH/2, -zSign*GD/2); group.add(backDepthR);

                // Xà hậu (back crossbar)
                const backCross = new THREE.Mesh(crossGeo, postMat);
                backCross.rotation.z = Math.PI/2; backCross.position.set(0, GH, -zSign*GD); group.add(backCross);

                // Cột đứng sau trái + phải
                const backPostL = new THREE.Mesh(postGeo, postMat);
                backPostL.position.set(-GW/2, GH/2, -zSign*GD); group.add(backPostL);
                const backPostR = new THREE.Mesh(postGeo, postMat);
                backPostR.position.set( GW/2, GH/2, -zSign*GD); group.add(backPostR);

                // Lưới — 3 mặt: trái, phải, sau; mặt trên
                function addNetPlane(w, h, x, y, z, rx, ry) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h, Math.round(w*3), Math.round(h*3)), netMat);
                    m.position.set(x, y, z); if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry; group.add(m);
                }
                // Lưới sau
                addNetPlane(GW, GH, 0, GH/2, -zSign*GD, 0, 0);
                // Lưới trái
                addNetPlane(GD, GH, -GW/2, GH/2, -zSign*GD/2, 0, Math.PI/2);
                // Lưới phải
                addNetPlane(GD, GH,  GW/2, GH/2, -zSign*GD/2, 0, Math.PI/2);
                // Lưới trên
                addNetPlane(GW, GD, 0, GH, -zSign*GD/2, Math.PI/2, 0);

                group.position.z = zSign * 28;
                group.rotation.y = Math.PI;
                scene.add(group);
            }

            buildGoal(1);
            buildGoal(-1);
        }

        function loadFlamingo() {

        function setupButtonControls() {
            const zone  = document.getElementById('joystick-zone');
            const thumb = document.getElementById('joystick-thumb');
            const RADIUS = 52; // max thumb travel (px)
            let activePtr = null, originX = 0, originY = 0;

            function applyJoy(dx, dy) {
                const len = Math.sqrt(dx*dx + dy*dy);
                const clamped = Math.min(len, RADIUS);
                const nx = len > 0.001 ? dx/len : 0;
                const ny = len > 0.001 ? dy/len : 0;
                thumb.style.left = (80 + nx*clamped) + 'px';
                thumb.style.top  = (80 + ny*clamped) + 'px';

                const dead = 0.25;
                keys.w = ny < -dead;
                keys.s = ny >  dead;
                keys.a = nx < -dead;
                keys.d = nx >  dead;
            }

            function resetJoy() {
                thumb.style.left = '80px'; thumb.style.top = '80px';
                thumb.classList.remove('active');
                keys.w = keys.s = keys.a = keys.d = false;
                activePtr = null;
            }

            zone.addEventListener('pointerdown', e => {
                e.preventDefault();
                if (activePtr !== null) return;
                activePtr = e.pointerId;
                zone.setPointerCapture(e.pointerId);
                const r = zone.getBoundingClientRect();
                originX = r.left + r.width/2;
                originY = r.top  + r.height/2;
                thumb.classList.add('active');
                applyJoy(e.clientX - originX, e.clientY - originY);
            }, { passive: false });

            zone.addEventListener('pointermove', e => {
                if (e.pointerId !== activePtr) return;
                e.preventDefault();
                applyJoy(e.clientX - originX, e.clientY - originY);
            }, { passive: false });

            zone.addEventListener('pointerup',     e => { if (e.pointerId === activePtr) resetJoy(); });
            zone.addEventListener('pointercancel', e => { if (e.pointerId === activePtr) resetJoy(); });
        }

        function startMultiplayer() {
            const loader = new GLTFLoader();
            loader.load(ROBOT_URL, gltf => {
                myRobot = gltf.scene;
                myRobot.position.set((Math.random()-.5)*8, 0, (Math.random()-.5)*8);
                scene.add(myRobot);
                mixer = new THREE.AnimationMixer(myRobot);

                const btnContainer = document.getElementById('buttons');
                gltf.animations.forEach(clip => {
                    if (clip.name.includes('Face')) return;
                    actions[clip.name] = mixer.clipAction(clip);
                    const btn = document.createElement('button');
                    btn.innerText = clip.name; btn.id = 'anim-' + clip.name;
                    btn.onclick = () => fadeTo(clip.name);
                    btnContainer.appendChild(btn);
                });
                if (actions['Idle']) { actions['Idle'].play(); highlightBtn('Idle'); }

                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('ui-panel').style.display        = 'block';
                document.getElementById('status-bar').style.display      = 'block';
                document.getElementById('chat-panel').style.display      = 'flex';
                document.getElementById('room-display').innerText = `PHÒNG: ${currentRoom}`;

                myRef = ref(db, `rooms/${currentRoom}/users/${myId}`);
                onDisconnect(myRef).remove();

                onValue(ref(db, `rooms/${currentRoom}/users`), snapshot => {
                    const users = snapshot.val() || {};
                    // Lọc ra danh sách không có myId
                    const others = {};
                    for (const id in users) { if (id !== myId) others[id] = users[id]; }

                    document.getElementById('player-count').innerText = Object.keys(users).length;

                    // Xóa robot đã rời phòng
                    for (const id in otherRobots) { if (!others[id]) removeOtherRobot(id); }
                    // Cập nhật/tạo robot người khác
                    for (const id in others) { updateOtherRobot(id, others[id]); }

                    // Người có id nhỏ nhất làm host bóng, reset snap khi đổi host
                    const ids = Object.keys(users).sort();
                    const wasHost = amBallHost;
                    amBallHost = (ids[0] === myId);
                    if (amBallHost && !wasHost) lastBallSnap = {}; // force push ngay khi lên host
                });

                syncInterval = setInterval(() => {
                    if (!myRobot || !myRef) return;
                    update(myRef, {
                        x: myRobot.position.x, z: myRobot.position.z,
                        ry: myRobot.rotation.y, action: activeActionName,
                        name: myName, ts: Date.now()
                    });
                    // Chỉ host mới push vị trí bóng
                    if (amBallHost && soccerBall) {
                        const bx = +soccerBall.position.x.toFixed(3);
                        const bz = +soccerBall.position.z.toFixed(3);
                        const vx = +ballVel.x.toFixed(3);
                        const vz = +ballVel.z.toFixed(3);
                        // Chỉ gửi khi có thay đổi đáng kể (giảm write)
                        const moved = Math.abs(bx - (lastBallSnap.x||0)) > 0.05
                                   || Math.abs(bz - (lastBallSnap.z||0)) > 0.05
                                   || Math.abs(vx - (lastBallSnap.vx||0)) > 0.1
                                   || Math.abs(vz - (lastBallSnap.vz||0)) > 0.1;
                        if (moved) {
                            lastBallSnap = { x: bx, z: bz, vx, vz };
                            set(ref(db, `rooms/${currentRoom}/ball`), lastBallSnap);
                        }
                    }
                }, 50);

                // Guest nhận vị trí bóng từ Firebase — lerp mượt, không ghi đè vận tốc đột ngột
                ballRef = ref(db, `rooms/${currentRoom}/ball`);
                onValue(ballRef, snapshot => {
                    if (amBallHost || !soccerBall) return;
                    const d = snapshot.val();
                    if (!d) return;
                    const lerpPos = 0.3, lerpVel = 0.5;
                    soccerBall.position.x += (d.x - soccerBall.position.x) * lerpPos;
                    soccerBall.position.z += (d.z - soccerBall.position.z) * lerpPos;
                    soccerBall.position.y  = BALL_RADIUS;
                    ballVel.x += ((d.vx ?? 0) - ballVel.x) * lerpVel;
                    ballVel.z += ((d.vz ?? 0) - ballVel.z) * lerpVel;
                });

                chatRef = ref(db, `rooms/${currentRoom}/chat`);
                onValue(chatRef, snapshot => {
                    const msgs = snapshot.val() || {};
                    Object.values(msgs).sort((a,b)=>a.ts-b.ts).filter(m=>m.ts>lastChatTs).forEach(m => {
                        lastChatTs = Math.max(lastChatTs, m.ts);
                        const div = document.createElement('div');
                        div.className = 'chat-msg' + (m.id===myId ? ' mine' : '');
                        div.innerHTML = `<span class="chat-name">${escHtml(m.name)}:</span>${escHtml(m.text)}`;
                        const log = document.getElementById('chat-log');
                        log.appendChild(div); log.scrollTop = log.scrollHeight;
                        chatBubbles[m.id] = { text: m.text, expiry: Date.now() + 4000 };
                    });
                });

                function sendChat() {
                    const input = document.getElementById('chat-input');
                    const text = input.value.trim(); if (!text) return;
                    input.value = '';
                    set(ref(db, `rooms/${currentRoom}/chat/${Date.now()}_${myId}`),
                        { id: myId, name: myName, text, ts: Date.now() });
                }
                document.getElementById('chat-send').onclick = sendChat;
                document.getElementById('chat-input').addEventListener('keydown', e => {
                    if (e.key === 'Enter') { e.stopPropagation(); sendChat(); }
                });

            }, xhr => {
                document.getElementById('loading-text').innerText =
                    `⏳ Đang tải robot... ${Math.round(xhr.loaded/xhr.total*100)}%`;
            }, err => {
                console.error(err);
                document.getElementById('loading-text').innerText = '❌ Lỗi tải mô hình.';
            });
        }

        function triggerJump() {
            if (!actions['WalkJump'] || jumpCooldown > 0) return;
            jumpCooldown = 0.35;
            const prev = activeActionName;
            actions[activeActionName]?.fadeOut(0.1);
            actions['WalkJump'].reset().setLoop(THREE.LoopOnce, 1).fadeIn(0.1).play();
            actions['WalkJump'].clampWhenFinished = true;
            highlightBtn('WalkJump');
            activeActionName = 'WalkJump';
            setTimeout(() => {
                actions['WalkJump']?.fadeOut(0.15);
                const resume = (Object.keys(keys).some(k=>keys[k]) && actions['Running']) ? 'Running' : 'Idle';
                actions[resume]?.reset().fadeIn(0.15).play();
                activeActionName = resume;
                highlightBtn(resume);
            }, 350);
        }

        function fadeTo(name, fadeTime = 0.15) {
            if (activeActionName === name || !actions[name]) return;
            actions[activeActionName]?.fadeOut(fadeTime);
            actions[name].reset().fadeIn(fadeTime).play();
            highlightBtn(activeActionName); activeActionName = name; highlightBtn(name);
        }

        function highlightBtn(name) {
            document.querySelectorAll('#buttons button').forEach(b => b.classList.remove('active-anim'));
            const b = document.getElementById('anim-' + name);
            if (b) b.classList.add('active-anim');
        }

        function escHtml(str) {
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function updateOtherRobot(id, data) {
            if (id === myId) return;  // tuyệt đối không spawn robot của mình
            if (!data || data.x === undefined) return;
            if (otherRobots[id]) {
                // Chỉ cập nhật, không tạo mới
                const rb = otherRobots[id];
                rb.mesh.position.x += (data.x - rb.mesh.position.x) * 0.3;
                rb.mesh.position.z += (data.z - rb.mesh.position.z) * 0.3;
                rb.mesh.rotation.y  = data.ry || 0;
                if (data.name) rb.name = data.name;
                const ta = data.action || 'Idle';
                if (rb.current !== ta && rb.actions[ta]) {
                    rb.actions[rb.current]?.fadeOut(0.2);
                    rb.actions[ta].reset().fadeIn(0.2).play();
                    rb.current = ta;
                }
                return;
            }
            // Chưa có → load mới, đánh dấu đang load để không load trùng
            if (otherRobots[id] === null) return; // đang pending
            otherRobots[id] = null; // pending marker
            const loader = new GLTFLoader();
            loader.load(ROBOT_URL, gltf => {
                // Kiểm tra lại: nếu user đã rời phòng trong lúc load thì bỏ
                if (otherRobots[id] !== null) return;
                const robot  = gltf.scene;
                const oMixer = new THREE.AnimationMixer(robot);
                const oActs  = {};
                gltf.animations.forEach(c => { if (!c.name.includes('Face')) oActs[c.name] = oMixer.clipAction(c); });
                if (oActs['Idle']) oActs['Idle'].play();
                robot.traverse(child => {
                    if (child.isMesh && child.material) {
                        const mat = child.material.clone();
                        mat.color.multiplyScalar(0.7);
                        mat.emissive = new THREE.Color(0x003344);
                        child.material = mat;
                    }
                });
                robot.position.set(data.x, 0, data.z);
                robot.rotation.y = data.ry || 0;
                scene.add(robot);
                otherRobots[id] = { mesh: robot, mixer: oMixer, actions: oActs, current: 'Idle', name: data.name || 'Robot' };
            });
        }

        function removeOtherRobot(id) {
            if (otherRobots[id] && otherRobots[id] !== null) {
                scene.remove(otherRobots[id].mesh);
            }
            delete otherRobots[id];
        }

        function drawNametags() {
            if (!ntagCtx) return;
            ntagCtx.clearRect(0, 0, ntagCanvas.width, ntagCanvas.height);
            const now = Date.now();

            function project(pos3d) {
                const v = pos3d.clone().project(camera);
                if (v.z > 1) return null;
                return {
                    x: (v.x * 0.5 + 0.5) * ntagCanvas.width,
                    y: (-v.y * 0.5 + 0.5) * ntagCanvas.height
                };
            }

            function drawTag(robot, name, bubble) {
                const headPos = robot.position.clone(); headPos.y += 5.0;
                const s = project(headPos); if (!s) return;
                ntagCtx.save();

                ntagCtx.font = 'bold 13px Segoe UI, sans-serif';
                const tw = ntagCtx.measureText(name).width;
                const bw = tw + 16, bh = 24, bx = s.x - bw/2, by = s.y - bh/2;
                ntagCtx.shadowColor = 'rgba(0,0,0,0.8)'; ntagCtx.shadowBlur = 6;
                ntagCtx.fillStyle = 'rgba(0,0,0,0.7)';
                ntagCtx.beginPath(); ntagCtx.roundRect(bx, by, bw, bh, 6); ntagCtx.fill();
                ntagCtx.strokeStyle = '#00d4ff'; ntagCtx.lineWidth = 1.5; ntagCtx.shadowBlur = 0; ntagCtx.stroke();
                ntagCtx.fillStyle = '#fff'; ntagCtx.textAlign = 'center'; ntagCtx.textBaseline = 'middle';
                ntagCtx.fillText(name, s.x, s.y);

                if (bubble && now < bubble.expiry) {
                    const alpha = Math.min(1, (bubble.expiry - now) / 600);
                    ntagCtx.globalAlpha = alpha;
                    ntagCtx.font = '12px Segoe UI, sans-serif';
                    const maxW = 160, words = bubble.text.split(' ');
                    let lines = [], cur = '';
                    words.forEach(w => {
                        const test = cur ? cur + ' ' + w : w;
                        if (ntagCtx.measureText(test).width > maxW) { lines.push(cur); cur = w; }
                        else cur = test;
                    });
                    if (cur) lines.push(cur);
                    const lh = 17, cbh = lines.length * lh + 10;
                    const cbw = Math.min(maxW+20, Math.max(...lines.map(l => ntagCtx.measureText(l).width))+20);
                    const cbx = s.x - cbw/2, cby = by - cbh - 8;
                    ntagCtx.fillStyle = 'rgba(0,212,255,0.15)';
                    ntagCtx.shadowColor = 'rgba(0,212,255,0.4)'; ntagCtx.shadowBlur = 8;
                    ntagCtx.beginPath(); ntagCtx.roundRect(cbx, cby, cbw, cbh, 8); ntagCtx.fill();
                    ntagCtx.strokeStyle = '#00d4ff'; ntagCtx.lineWidth = 1; ntagCtx.shadowBlur = 0; ntagCtx.stroke();
                    ntagCtx.fillStyle = '#00d4ff';
                    ntagCtx.beginPath();
                    ntagCtx.moveTo(s.x-5, cby+cbh); ntagCtx.lineTo(s.x+5, cby+cbh); ntagCtx.lineTo(s.x, cby+cbh+7);
                    ntagCtx.fill();
                    ntagCtx.fillStyle = '#fff'; ntagCtx.shadowBlur = 0;
                    lines.forEach((line, i) => ntagCtx.fillText(line, s.x, cby + 10 + lh*i + lh/2));
                    ntagCtx.globalAlpha = 1;
                }
                ntagCtx.restore();
            }

            if (myRobot) drawTag(myRobot, '⭐ ' + myName, chatBubbles[myId]);
            for (const id in otherRobots) {
                drawTag(otherRobots[id].mesh, otherRobots[id].name || 'Robot', chatBubbles[id]);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt   = Math.min(clock.getDelta(), 0.05);
            const time = performance.now() * 0.001;

            if (myRobot) {
                const camYaw = orbitControls.getAzimuthalAngle();
                const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
                const right   = new THREE.Vector3( Math.cos(camYaw), 0, -Math.sin(camYaw));
                const moveDir = new THREE.Vector3();
                if (keys.w) moveDir.add(forward);
                if (keys.s) moveDir.sub(forward);
                if (keys.a) moveDir.sub(right);
                if (keys.d) moveDir.add(right);

                const moving = moveDir.lengthSq() > 0.001;
                if (moving) {
                    moveDir.normalize();
                    velocity.x += (moveDir.x * MAX_SPEED - velocity.x) * Math.min(ACCEL * dt, 1);
                    velocity.y += (moveDir.z * MAX_SPEED - velocity.y) * Math.min(ACCEL * dt, 1);
                    targetRotY = Math.atan2(moveDir.x, moveDir.z);
                } else {
                    velocity.x *= Math.max(0, 1 - DECEL * dt);
                    velocity.y *= Math.max(0, 1 - DECEL * dt);
                }

                myRobot.position.x += velocity.x * dt;
                myRobot.position.z += velocity.y * dt;
                myRobot.position.y  = 0;

                if (moving) {
                    let diff = targetRotY - currentRotY;
                    while (diff >  Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    currentRotY += diff * Math.min(12 * dt, 1);
                    myRobot.rotation.y = currentRotY;
                }

                const speed = Math.sqrt(velocity.x * velocity.x + velocity.y * velocity.y);
                if (speed > 0.3) {
                    if (mixer) mixer.timeScale = 0.6 + (speed / MAX_SPEED) * 0.8;
                    if (activeActionName !== 'Running') fadeTo('Running', 0.15);
                } else {
                    if (mixer) mixer.timeScale = 1;
                    if (activeActionName === 'Running') fadeTo('Idle', 0.25);
                }
            }

            if (flamingo) {
                flamingo.position.x = Math.sin(time * 0.4) * 12;
                flamingo.position.z = Math.cos(time * 0.4) * 12;
                flamingo.position.y = 7 + Math.sin(time * 1.2) * 1.5;
                flamingo.rotation.y = time * 0.4 + Math.PI / 2;
                if (flamingoMixer) flamingoMixer.update(dt);
            }

            if (mixer) mixer.update(dt);
            for (const id in otherRobots) {
                if (otherRobots[id].mixer) otherRobots[id].mixer.update(dt);
            }

            updateSoccerBall(dt);
            orbitControls.update();
            renderer.render(scene, camera);
            drawNametags();
        }
    </script>
</body>
